name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: nickfan/certman
  GHCR_IMAGE: ghcr.io/nickfan/certman

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_required: ${{ steps.release.outputs.release_required }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Run tests
        env:
          NO_COLOR: "1"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run --frozen pytest

      - name: Resolve release metadata
        id: release
        run: python scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate publication credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing repository secret DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing repository secret DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ needs.validate.outputs.release_required == 'true' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.release_required == 'true' }}

      - name: Build and publish images
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true

      - name: Verify public image manifests
        env:
          RELEASE_REQUIRED: ${{ needs.validate.outputs.release_required }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker logout
          docker logout ghcr.io

          tags=(edge)
          if [ "$RELEASE_REQUIRED" = "true" ]; then
            tags+=("$VERSION" latest)
          fi

          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${tag}"
            docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}"
          done

      - name: Create GitHub tag and release
        if: needs.validate.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Notify release webhook
        if: needs.validate.outputs.release_required == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ -z "$RELEASE_WEBHOOK_URL" ] && [ -z "$RELEASE_WEBHOOK_SECRET" ]; then
            echo "Release webhook is not configured; skipping notification."
            exit 0
          fi
          if [ -z "$RELEASE_WEBHOOK_URL" ] || [ -z "$RELEASE_WEBHOOK_SECRET" ]; then
            echo "::error::RELEASE_WEBHOOK_URL and RELEASE_WEBHOOK_SECRET must be configured together"
            exit 1
          fi

          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          payload="$(
            jq -nc \
              --arg digest "$IMAGE_DIGEST" \
              --arg dockerhub "${DOCKERHUB_IMAGE}:${VERSION}" \
              --arg event "release.published" \
              --arg ghcr "${GHCR_IMAGE}:${VERSION}" \
              --arg release_url "$release_url" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$GITHUB_SHA" \
              --arg tag "$TAG" \
              --arg version "$VERSION" \
              '{
                event: $event,
                repository: $repository,
                version: $version,
                tag: $tag,
                sha: $sha,
                release_url: $release_url,
                digest: $digest,
                images: {
                  dockerhub: $dockerhub,
                  ghcr: $ghcr
                }
              }'
          )"
          signature="$(
            printf '%s' "$payload" \
              | python -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["RELEASE_WEBHOOK_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())'
          )"

          curl \
            --fail \
            --max-time 30 \
            --retry 3 \
            --show-error \
            --silent \
            --output /dev/null \
            -H "Content-Type: application/json" \
            -H "X-CertMan-Event: release.published" \
            -H "X-CertMan-Signature-256: sha256=${signature}" \
            --data "$payload" \
            "$RELEASE_WEBHOOK_URL"
